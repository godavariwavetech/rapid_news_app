# Add inside the HTTPS server for www.rapidnewsnetwork.in.
# Replace the upstream port with the actual backend HTTP listener if different.
# This takes precedence over the static /app fallback. WhatsApp crawlers cannot
# use JavaScript to retrieve per-article Open Graph metadata from index.html.
location ~ ^/app/article/[0-9a-fA-F]{24}/?$ {
    proxy_pass http://127.0.0.1:7777;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
